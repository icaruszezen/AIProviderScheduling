# Home mode cluster (HOME_JWT). This is NOT the master/slave config sync
# described in docs/cluster.md, and the two cannot be combined: the cluster
# protocol endpoints are disabled whenever Home mode is enabled.
services:
  cli-proxy-api:
    image: ${CLI_PROXY_IMAGE:-ghcr.io/icaruszezen/cliproxyapi-x:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cli-proxy-api-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${CLI_PROXY_HOME_PATH:-./home}:/root/.cli-proxy-api
      - ${CLI_PROXY_LOG_PATH:-./logs}:/CLIProxyAPI/logs
      - ${CLI_PROXY_PLUGIN_PATH:-./plugins}:/CLIProxyAPI/plugins
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./CLIProxyAPI -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
