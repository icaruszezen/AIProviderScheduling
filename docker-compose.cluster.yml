# Home mode cluster (HOME_JWT). This is NOT the master/slave config sync
# described in docs/cluster.md, and the two cannot be combined: the cluster
# protocol endpoints are disabled whenever Home mode is enabled.
services:
  aiproviderscheduling:
    image: ${APS_IMAGE:-ghcr.io/icaruszezen/aiproviderscheduling:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: aiproviderscheduling-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ${APS_HOME_PATH:-./home}:/root/.ai-provider-scheduling
      - ${APS_LOG_PATH:-./logs}:/AIProviderScheduling/logs
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./AIProviderScheduling -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
